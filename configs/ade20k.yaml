# ADE20K config for class-adaptive thresholding
dataset: ade20k
nclass: 150
crop_size: 512
data_root: /data/ADE20K/ADEChallengeData2016

# Training
epochs: 120
batch_size: 8
lr: 0.001
lr_multi: 10.0
criterion:
  name: CELoss
  kwargs:
    ignore_index: 255

# Model
backbone: resnet50
pretrain: True
multi_grid: False
replace_stride_with_dilation: [False, True, True]
dilations: [12, 24, 36]

# Class-adaptive thresholding
method: class_adaptive
warmup_epochs: 15
ema_decay: 0.999
lambda_coverage: 0.1
delta: 0.05
base_threshold: 0.6
gamma: 1.0
beta: 0.5
